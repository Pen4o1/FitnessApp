# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploy from the repo root:
#   render blueprint sync
#
# Or connect the repo in the Render dashboard and point it at this file.

services:
  - type: web
    name: fitness-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      # APP_URL falls back to Render's RENDER_EXTERNAL_URL in docker/entrypoint.sh
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: fitness-db
          property: internalConnectionString
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
      # Set these in the Render dashboard (secrets):
      # - FATSECRET_CLIENT_ID
      # - FATSECRET_CLIENT_SECRET

databases:
  - name: fitness-db
    plan: free
    databaseName: fitness
    user: fitness
